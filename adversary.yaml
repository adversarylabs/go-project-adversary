name: go/project
version: 0.0.4
description: "Reviews Go repository hygiene: build-script prerequisites, pipe-to-shell scripts, committed binaries, CI toolchain skew, and license presence."

triggers:
  manual: true
  files_changed:
    - "**/*.go"
    - "**/go.mod"
    - "**/Makefile"
    - "**/Taskfile.yml"
    - "**/Taskfile.yaml"
    - "**/*.sh"
    - "**/README*"
    - "**/CONTRIBUTING*"
    - "**/PREREQUISITE*"
    - "**/docs/**/*prereq*"
    - "**/docs/**/*getting-started*"
    - "**/docs/**/*setup*"
    - "**/.github/workflows/*.{yml,yaml}"
    - "**/.gitlab-ci.yml"
    - "**/LICENSE*"
    - "**/COPYING*"
    - "**/.gitignore"
    - "**/.idea/**"
    - "**/*.exe"

detection:
  files:
    - "**/*.go"
    - "**/go.mod"
    - "**/Makefile"
    - "**/Taskfile.yml"
    - "**/Taskfile.yaml"
    - "**/*.sh"
    - "**/README*"
    - "**/CONTRIBUTING*"
    - "**/PREREQUISITE*"
    - "**/docs/**/*prereq*"
    - "**/docs/**/*getting-started*"
    - "**/docs/**/*setup*"
    - "**/.github/workflows/*.{yml,yaml}"
    - "**/.gitlab-ci.yml"
    - "**/LICENSE*"
    - "**/COPYING*"
    - "**/.gitignore"
    - "**/.idea/**"
    - "**/*.exe"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
